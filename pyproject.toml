[project]
name = "bili-market-price-watcher"
version = "0.1.0"
description = "Bilibili 市集商品价格监视器"
requires-python = ">=3.11"  # tomllib 需要 3.11+
# PyQt5 是 GPL-3.0 / 商业授权双许可（非 LGPL），分发时整个程序必须 GPL-3.0
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.28",
    "PyQt5>=5.15",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.tasks]
start = { cmd = "python src/app.py", cwd = "." }

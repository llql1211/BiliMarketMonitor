[project]
name = "bili-market-price-watcher"
version = "0.1.0"
description = "Bilibili 市集商品价格监视器"
requires-python = ">=3.11"  # tomllib 需要 3.11+
# PyQt5 是 GPL-3.0 / 商业授权双许可（非 LGPL），分发时整个程序必须 GPL-3.0
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.28",
    "PyQt5>=5.15",
]

# 测试依赖：pip 用户 `pip install -e ".[test]"`
[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.tasks]
start = { cmd = "python src/app.py", cwd = "." }

# pixi 不认 [project.optional-dependencies]，同一份依赖得在这里再写一次；
# 把 test feature 并进默认环境，`pixi run test` 和 `pixi run start` 共用一个环境。
[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=8"

[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }

[tool.pixi.feature.test.tasks]
test = { cmd = "python -m pytest", cwd = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]

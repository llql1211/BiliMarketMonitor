# 本文件为程序默认配置文件，若想进行个性化配置，请把本文件复制为 config.toml 再
# 修改。config.toml 不会被 git 跟踪。

# ---------------- 基本设置 ----------------

# 商品详情页链接模板，必须包含 {clusterId} 占位符
detail_url_template = "https://mall.bilibili.com/neul-next/resell/detail.html?clusterId={clusterId}"

# 抓取商品的间隔（秒），不建议太小
poll_interval_seconds = 0.5

# 单个商品抓取失败后、重试前的等待（秒）
retry_interval_seconds = 1

# 单次请求超时（秒）
request_timeout_seconds = 10

# 近期成交发生在多少个小时内，就将成交高亮，并用下面的颜色表示。

# 时间设为 0 表示关闭高亮。
deal_highlight_within_hours = 24

# 文字颜色支持 RGB （如 #rrggbb）和颜色名（如 orange）。
deal_highlight_color = "#e07000"

# ---------------- 定时抓取设置 ----------------

# 是否启动定时抓取
auto_poll_enabled = false

# 定时抓取间隔（分钟）
auto_poll_interval_minutes = 30

# 定时抓取的范围，取值只能为：
# - all = 清单里全部商品；
# - favorite = 只抓收藏的，
# - sold_out = 只抓「已售罄」的
auto_poll_scope = "all"

# 自动抓取跑完是否弹总结窗口
auto_poll_show_summary = false

# ---------------- 企业微信推送设置 ----------------

# 是否启用推送。默认关闭时下面这些项一个都不起作用
notify_enabled = false

# 企业微信群机器人的 webhook 地址，形如：https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxxxxxx-xxxx-xxxx
# 留空表示推送开着但还没配好，程序会在终端内提醒
notify_wecom_webhook = ""

# 两次推送间最小间隔（秒）
notify_min_interval_seconds = 60

# 通知类型，各自独立开关。前两项默认开着（补货和收藏到价是要盯着的事），
# 后三项默认关掉（消息太密就没人看了，觉得需要再打开）
#
# 推的是「这一轮刚发生的事」：一直低于预期价、一直等于史低价都不会反复推，
# 只在变化发生的那一刻推一次；第一次抓到的商品没有上一轮可比，只记个底，
# 不发通知。一件商品同时踩中几条会写在同一行里，如「恢复在售 · 创史低」
# 售罄→在售（任何商品）

# 通知内容设置：

# 任何售罄商品恢复在售：
notify_on_restock = true
# 收藏商品跌破预期价（上一次不低、这一次低了）
notify_on_favorite_target = true
# 收藏商品刷新史低价
notify_on_favorite_lowest = false
# 收藏商品降价（价格上下波动很常见，开着容易刷屏）
notify_on_favorite_drop = false
# 非收藏商品跌破预期价
notify_on_any_target = false
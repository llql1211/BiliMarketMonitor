# 本文件为程序默认配置文件，默认无需修改。若想进行个性化配置，请把本文件
# 复制为 config.toml 后按需修改。config.toml 不会被 git 跟踪。

# 商品详情页链接模板，必须包含 {clusterId} 占位符
detail_url_template = "https://mall.bilibili.com/neul-next/resell/detail.html?clusterId={clusterId}"

# 依次抓取每个商品之间的间隔（秒），建议不小于 2
poll_interval_seconds = 2

# 单个商品抓取失败后、重试前的等待（秒）
retry_interval_seconds = 1

# 单次请求超时（秒）
request_timeout_seconds = 10

# 成交新鲜度高亮：最近一次成交发生在多少小时内，就把成交价格加粗并用下面的颜色显示。
# 单位是小时；设为 0 表示关闭高亮
deal_highlight_within_hours = 24

# 高亮成交用的文字颜色，支持 #rrggbb 和颜色名（如 orange）。
# 默认值在深浅两种主题的表格底色下都看得清，自己换色时留意这一点
deal_highlight_color = "#e07000"

# ---------------- 自动抓取 ----------------

# 是否按下面的间隔自动抓取。默认关闭，只有手动点「开始抓取」才抓
auto_poll_enabled = false

# 自动抓取的间隔（分钟）。从上一轮结束算起，所以某一轮抓得慢只会把下一轮顺延，
# 不会一轮叠一轮
auto_poll_interval_minutes = 30

# 自动抓取的范围：all = 清单里全部商品，favorite = 只抓收藏的，
# sold_out = 只抓缓存里记着「已售罄」的（想盯着什么时候补货）
auto_poll_scope = "all"

# 自动抓取跑完是否弹总结窗口。默认不弹——自动抓取是没人看着的时候跑的，
# 每轮都弹会把桌面糊满；手动抓取无论这一项怎么设都会弹
auto_poll_show_summary = false